<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juuso & Bomin</title>
    <style>
        /* Imported Noto Serif KR for the elegant Korean button text */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+KR:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --bg-color: #384030; 
            --inset-bg: #303729; 
            --text-main: #F4F1EA; 
            --accent: #D4AF37; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Exactly matches your beautifully boxed hero section */
        .hero-wrapper {
            height: 100vh;
            padding: 24px; 
            box-sizing: border-box;
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto;
        }

        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%; 
            width: 100%;
            border-radius: 12px;
            text-align: center;
            padding: 0 24px;
            box-sizing: border-box;
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('couple.jpg');
            background-size: cover;
            background-position: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.25); 
            overflow: hidden;
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.8rem; 
            letter-spacing: -0.02em;
            margin: 0 0 40px 0; 
            color: #FFFFFF; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.3); 
        }

        /* Container for the buttons */
        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
            max-width: 300px; /* Keeps the buttons neatly sized */
        }

        /* Side-by-side flags */
        .flag-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        /* Frosted Glass Button Styling */
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(48, 55, 41, 0.75); /* Semi-transparent olive */
            backdrop-filter: blur(10px); /* Creates the frosted glass look */
            -webkit-backdrop-filter: blur(10px); /* For iPhones */
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .nav-btn:hover {
            background-color: rgba(48, 55, 41, 0.95);
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .flag-btn {
            flex: 1; /* Makes both flags perfectly equal width */
            padding: 20px 0;
            font-size: 3rem; /* Massive, clickable emojis */
            line-height: 1.2;
        }

        .camera-btn {
            padding: 14px 24px;
            width: 100%; 
            box-sizing: border-box;
            gap: 16px;
            border-color: rgba(212, 175, 55, 0.4); 
            justify-content: flex-start; /* Aligns contents neatly to the left inside the button */
        }

        .camera-btn:hover {
            border-color: var(--accent);
        }

        .camera-btn svg {
            color: var(--accent);
            flex-shrink: 0;
        }

        .btn-text-wrapper {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .btn-text-en {
            font-size: 1.2rem;
            font-weight: 400;
        }

        .btn-text-ko {
            font-family: 'Noto Serif KR', serif;
            font-size: 0.9rem;
            font-weight: 300;
            color: rgba(244, 241, 234, 0.7); /* Faded cream color */
            margin-top: 2px;
        }

        /* Mobile adjustments */
        @media (max-width: 700px) {
            .hero-wrapper { padding: 16px; } 
            .hero h1 { font-size: 3.5rem; margin-bottom: 32px; }
            .flag-btn { padding: 16px 0; font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="hero-wrapper">
        <section class="hero">
            <h1>Juuso & Bomin</h1>
            
            <div class="actions-container">
                <div class="flag-row">
                    <!-- Finnish Flag links to en.html -->
                    <a href="en.html" class="nav-btn flag-btn" aria-label="English / Finnish">
                        🇫🇮
                    </a>
                    <!-- Korean Flag links to ko.html -->
                    <a href="ko.html" class="nav-btn flag-btn" aria-label="Korean">
                        🇰🇷
                    </a>
                </div>
                
                <!-- Camera Button links to upload.html -->
                <a href="upload.html" class="nav-btn camera-btn" aria-label="Share Photos">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <div class="btn-text-wrapper">
                        <span class="btn-text-en">Share Photos</span>
                        <span class="btn-text-ko">사진 공유하기</span>
                    </div>
                </a>
            </div>
        </section>
    </div>
</body>
</html>
