<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juuso & Bomin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            var(--bg-color): #384030; 
            --alt-bg: #434B3A; 
            --text-main: #F4F1EA; 
            --text-muted: #C0C3B7; 
            --accent: #D4AF37; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #384030; /* Deep Olive */
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .front-door-container {
            padding: 40px 24px;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .date-location {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 48px;
            letter-spacing: 0.05em;
        }

        .divider {
            width: 40px;
            height: 2px;
            background-color: var(--accent);
            margin: 0 auto 48px auto;
        }

        /* Elegant Menu Buttons */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--alt-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 20px 32px;
            border-radius: 12px;
            font-size: 1.2rem;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .nav-btn:hover {
            background-color: #4A5340;
            border-color: rgba(212, 175, 55, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .btn-icon {
            font-size: 1.8rem;
            margin-right: 16px;
        }

        /* Camera Button gets a special gold accent */
        .camera-btn {
            margin-top: 16px;
            background-color: #303729;
            border-color: var(--accent);
        }

        .camera-btn:hover {
            background-color: #3A4332;
            border-color: var(--accent);
        }

        .camera-btn .btn-icon {
            color: var(--accent);
        }

    </style>
</head>
<body>

    <div class="front-door-container">
        <h1>Juuso & Bomin</h1>
        <div class="date-location">1.5.2027 • Seoul</div>
        
        <div class="divider"></div>

        <div class="menu-grid">
            <!-- Link to the English/Finnish Invitation -->
            <a href="en.html" class="nav-btn">
                <span class="btn-icon">🇫🇮</span>
                <span>Enter Invitation</span>
            </a>

            <!-- Link to the Korean Invitation -->
            <a href="ko.html" class="nav-btn">
                <span class="btn-icon">🇰🇷</span>
                <span style="font-family: 'Noto Serif KR', serif;">모바일 청첩장 보기</span>
            </a>

            <!-- Link to the Upload page we are about to build -->
            <a href="upload.html" class="nav-btn camera-btn">
                <span class="btn-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </span>
                <span>Share Photos</span>
            </a>
        </div>
    </div>

</body>
</html>
