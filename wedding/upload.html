<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Photos - Juuso & Bomin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --bg-color: #384030; 
            --alt-bg: #434B3A; 
            --inset-bg: #303729; 
            --text-main: #F4F1EA; 
            --text-muted: #C0C3B7; 
            --accent: #D4AF37; 
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
        }

        .upload-container {
            background-color: var(--alt-bg);
            border-radius: 12px;
            padding: 48px 32px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 12px 0;
            color: var(--accent);
        }

        p {
            color: var(--text-muted);
            margin: 0 0 24px 0;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Name Input Field Styling */
        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .name-input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--inset-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .name-input:focus {
            border-color: var(--accent);
        }

        .warning-text {
            font-size: 0.85rem;
            color: rgba(244, 241, 234, 0.7);
            background-color: rgba(0,0,0,0.15);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            line-height: 1.5;
            text-align: left;
        }

        /* The Custom Upload Button */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--inset-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 1.2rem;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.3s ease;
            gap: 12px;
        }

        .btn:hover { background-color: #353D2E; }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }

        /* Back Button */
        .back-link {
            display: inline-block;
            margin-top: 32px;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-main);
            border-bottom: 1px solid var(--text-main);
        }

        /* Loading UI */
        #loading-ui {
            display: none;
            margin-top: 24px;
        }

        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.2);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border-left-color: var(--accent);
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status-text {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        #progress-text {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <h1>Share Photos</h1>
        <p>Upload your favorite memories from the day directly to our wedding album.</p>
        
        <!-- Name Input -->
        <div class="input-group">
            <label for="uploader-name">Your Name / Family Name:</label>
            <input type="text" id="uploader-name" class="name-input" placeholder="e.g. Maria Virtanen" required />
        </div>

        <div class="warning-text">
            <em>💡 Tip: Please keep your screen awake while uploading. Wi-Fi is recommended!</em>
        </div>

        <!-- Upload Interface -->
        <div id="upload-interface" class="upload-btn-wrapper">
            <button class="btn" id="select-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                Select Photos
            </button>
            <input type="file" id="file-input" accept="image/*" multiple />
        </div>

        <!-- Loading Interface -->
        <div id="loading-ui">
            <div class="spinner"></div>
            <div id="status-text">Uploading...</div>
            <div id="progress-text">Preparing photos</div>
        </div>

        <a href="index.html" class="back-link">← Back to Menu</a>
    </div>

    <script>
        // --- IMPORTANT: PASTE YOUR GOOGLE SCRIPT URL BELOW ---
        const SCRIPT_URL = 'YOUR_GOOGLE_SCRIPT_URL_HERE';

        const fileInput = document.getElementById('file-input');
        const nameInput = document.getElementById('uploader-name');
        const uploadInterface = document.getElementById('upload-interface');
        const loadingUi = document.getElementById('loading-ui');
        const statusText = document.getElementById('status-text');
        const progressText = document.getElementById('progress-text');

        fileInput.addEventListener('change', async (e) => {
            const uploaderName = nameInput.value.trim();
            if (!uploaderName) {
                alert('Please enter your name before selecting photos!');
                fileInput.value = '';
                nameInput.focus();
                return;
            }

            const files = e.target.files;
            if (files.length === 0) return;

            // Hide form, show loading spinner
            uploadInterface.style.display = 'none';
            nameInput.disabled = true;
            loadingUi.style.display = 'block';
            statusText.innerText = "Uploading Original Files...";

            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                progressText.innerText = `Sending photo ${i + 1} of ${files.length}`;
                try {
                    await uploadRawFile(files[i], uploaderName);
                    successCount++;
                } catch (error) {
                    console.error("Upload failed for a file", error);
                }
            }

            // Finished
            loadingUi.style.display = 'none';
            uploadInterface.style.display = 'inline-block';
            nameInput.disabled = false;
            
            if (successCount === files.length) {
                alert('Thank you! All your photos have been successfully added to our album.');
            } else {
                alert(`Uploaded ${successCount} out of ${files.length} photos. Please try again if some failed.`);
            }
            
            fileInput.value = '';
        });

        function uploadRawFile(file, uploaderName) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = function(f) {
                    const base64Data = f.target.result.split(',')[1];
                    
                    const formData = new URLSearchParams();
                    formData.append('data', base64Data);
                    formData.append('filename', file.name);
                    formData.append('mimeType', file.type);
                    formData.append('uploaderName', uploaderName); // Pass name to Google Drive

                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors' 
                    }).then(() => {
                        resolve();
                    }).catch((error) => {
                        reject(error);
                    });
                };
                
                reader.onerror = () => reject("Error reading file");
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
